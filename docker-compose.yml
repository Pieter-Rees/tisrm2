services:
  tisrm2-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "26"
      pull: true
    container_name: tisrm2-frontend
    ports:
      - "3002:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - tisrm2-backend
    networks:
      - app-network

  tisrm2-backend:
    build:
      context: /home/pieter/Development/tis-risk-managers-backend
      dockerfile: Dockerfile
    container_name: tisrm2-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=http://localhost:3002
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
