services:
  tisrm2-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "26"
      pull: true
    container_name: tisrm2-frontend
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
